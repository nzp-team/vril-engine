name: Build
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  resolve-toolbox:
    name: Pull Toolbox
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Resolve Toolbox Image
        id: image
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          toolbox_image=$(sed -nE 's/^[[:space:]]*toolbox_image=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n 1)
          if [ -n "$toolbox_image" ]; then
            if [[ ! "$toolbox_image" =~ ^ghcr\.io/[A-Za-z0-9-]+/toolbox(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|@sha256:[0-9a-f]{64})$ ]]; then
              echo "Invalid Toolbox image: $toolbox_image" >&2
              exit 1
            fi
            image="$toolbox_image"
          else
            image='ghcr.io/nzp-team/toolbox:main'
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Toolbox Image: \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  discover-tests:
    if: github.event_name == 'pull_request'
    name: Discover tests
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: List tests
        id: tests
        env:
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          echo "Vril PR head: \`$PR_HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tested merge commit: \`$PR_MERGE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          tests=$(find testing/tests -maxdepth 1 -type f -name '*.sh' ! -name 'generate-source.sh' | sed -E 's@.*/([^/]+)\.sh$@\1@' | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')
          test "$tests" != '[]' && echo "tests=$tests" >> "$GITHUB_OUTPUT"

  Compile-Linux-Toolbox:
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
    name: Compile Linux (${{ matrix.arch }})
    needs: resolve-toolbox
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            host_arch: x86_64
            binary: build/sdl/nzportable
          - arch: x86
            runner: ubuntu-24.04
            host_arch: x86_64
            binary: build/sdl/x86/nzportable
          - arch: arm64
            runner: ubuntu-24.04
            host_arch: x86_64
            binary: build/sdl/arm64/nzportable
          - arch: armhf
            runner: ubuntu-24.04
            host_arch: x86_64
            binary: build/sdl/armhf/nzportable
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: ${{ matrix.host_arch }}
        run: /entrypoint.sh fetch
      - name: Select Vril commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          VRIL_REF: ${{ github.ref }}
          VRIL_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git -C /workspace/repos/vril-engine fetch origin "$VRIL_REF"
            git -C /workspace/repos/vril-engine checkout --detach FETCH_HEAD
            test "$(git -C /workspace/repos/vril-engine rev-parse HEAD)" = "$VRIL_SHA"
            test "$(git -C /workspace/repos/vril-engine rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          else
            git -C /workspace/repos/vril-engine fetch origin main
            git -C /workspace/repos/vril-engine checkout --detach "$VRIL_SHA"
          fi
      - name: Build
        run: /entrypoint.sh build-vril --target linux-${{ matrix.arch }} -- WERROR=1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-nzp-sdl
          path: /workspace/repos/vril-engine/${{ matrix.binary }}
          if-no-files-found: error
  Compile-Windows:
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
    name: Compile Windows (${{ matrix.arch }})
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64]
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select Vril commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          VRIL_REF: ${{ github.ref }}
          VRIL_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git -C /workspace/repos/vril-engine fetch origin "$VRIL_REF"
            git -C /workspace/repos/vril-engine checkout --detach FETCH_HEAD
            test "$(git -C /workspace/repos/vril-engine rev-parse HEAD)" = "$VRIL_SHA"
            test "$(git -C /workspace/repos/vril-engine rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          else
            git -C /workspace/repos/vril-engine fetch origin main
            git -C /workspace/repos/vril-engine checkout --detach "$VRIL_SHA"
          fi
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: /entrypoint.sh build-vril --target "windows-$ARCH" -- WERROR=1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-nzp-sdl
          path: /workspace/repos/vril-engine/build/sdl/windows-${{ matrix.arch }}/nzportable.exe
          if-no-files-found: error
  Compile-EBOOT:
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
    name: Compile PSP
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select Vril commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          VRIL_REF: ${{ github.ref }}
          VRIL_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git -C /workspace/repos/vril-engine fetch origin "$VRIL_REF"
            git -C /workspace/repos/vril-engine checkout --detach FETCH_HEAD
            test "$(git -C /workspace/repos/vril-engine rev-parse HEAD)" = "$VRIL_SHA"
            test "$(git -C /workspace/repos/vril-engine rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          else
            git -C /workspace/repos/vril-engine fetch origin main
            git -C /workspace/repos/vril-engine checkout --detach "$VRIL_SHA"
          fi
      - name: Build
        run: /entrypoint.sh build-vril --target psp -- WERROR=1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psp-nzp-eboot
          path: /workspace/repos/vril-engine/build/psp/bin/EBOOT.PBP
          if-no-files-found: error
  Compile-3DSX:
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
    name: Compile 3DS
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select Vril commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          VRIL_REF: ${{ github.ref }}
          VRIL_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git -C /workspace/repos/vril-engine fetch origin "$VRIL_REF"
            git -C /workspace/repos/vril-engine checkout --detach FETCH_HEAD
            test "$(git -C /workspace/repos/vril-engine rev-parse HEAD)" = "$VRIL_SHA"
            test "$(git -C /workspace/repos/vril-engine rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          else
            git -C /workspace/repos/vril-engine fetch origin main
            git -C /workspace/repos/vril-engine checkout --detach "$VRIL_SHA"
          fi
      - name: Build
        run: /entrypoint.sh build-vril --target 3ds -- WERROR=1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctr-nzp-3dsx
          path: /workspace/repos/vril-engine/build/ctr/bin/nzportable.3dsx
          if-no-files-found: error
  Compile-TNS:
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    container:
      image: bensuperpc/ndless:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build with Ndless SDK
        working-directory: ./
        run: |
          make -f Makefile.nspire WERROR=1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nspire-nzp-tns
          path: ./build/nspire/bin/nzportable.tns
  Compile-VPK:
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk
    steps:
      - uses: actions/checkout@v4
      - name: Install Packages
        run: |
          apt update && apt install -y git
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Setup vitaGL
        run: |
          git clone https://github.com/Rinnegatamante/vitaGL.git
          cd vitaGL
          git checkout 92888a7
          make MATH_SPEEDHACK=1 PRIMITIVES_SPEEDHACK=1 HAVE_FFP_SHADER_SUPPORT=1 DISABLE_FFP_MULTITEXTURE=1 HAVE_VERTEX_LAYOUT_CACHE=1 HAVE_WVP_ON_GPU=1 NO_TILE_CLIPPER=1 NO_SPLASHSCREEN=1 -j$(nproc)
          make install
      - name: Build
        working-directory: ./
        run: |
          make -f Makefile.psp2 WERROR=1 -j$(nproc)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psp2-nzp-vpk
          path: ./build/psp2/nzportable.vpk
  Compile-NRO:
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
    name: Compile Switch
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select Vril commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          VRIL_REF: ${{ github.ref }}
          VRIL_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git -C /workspace/repos/vril-engine fetch origin "$VRIL_REF"
            git -C /workspace/repos/vril-engine checkout --detach FETCH_HEAD
            test "$(git -C /workspace/repos/vril-engine rev-parse HEAD)" = "$VRIL_SHA"
            test "$(git -C /workspace/repos/vril-engine rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          else
            git -C /workspace/repos/vril-engine fetch origin main
            git -C /workspace/repos/vril-engine checkout --detach "$VRIL_SHA"
          fi
      - name: Build
        run: /entrypoint.sh build-vril --target switch -- WERROR=1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nx-nzp-nro
          path: |
            /workspace/repos/vril-engine/build/nx/bin/nzportable.nro
            /workspace/repos/vril-engine/build/nx/bin/nzportable.nacp
          if-no-files-found: error
  prepare-pr-test-content:
    if: github.event_name == 'pull_request'
    name: Prepare Pull Request Test Content
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      has_overrides: ${{ steps.dependencies.outputs.has_overrides }}
      quakec_ref: ${{ steps.dependencies.outputs.quakec_ref }}
      assets_ref: ${{ steps.dependencies.outputs.assets_ref }}
    steps:
      - name: Resolve dependency overrides
        id: dependencies
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          quakec_ref=$(sed -nE 's/^[[:space:]]*quakec_ref=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "${PR_BODY}" | head -n 1)
          assets_ref=$(sed -nE 's/^[[:space:]]*assets_ref=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "${PR_BODY}" | head -n 1)
          {
            echo "quakec_ref=${quakec_ref}"
            echo "assets_ref=${assets_ref}"
            echo "quakec_repository=${PR_HEAD_OWNER}/quakec"
            echo "assets_repository=${PR_HEAD_OWNER}/assets"
            if [[ -n "${quakec_ref}" || -n "${assets_ref}" ]]; then
              echo "has_overrides=true"
            else
              echo "has_overrides=false"
            fi
          } >> "${GITHUB_OUTPUT}"
      - name: Checkout QuakeC
        if: steps.dependencies.outputs.quakec_ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.dependencies.outputs.quakec_repository }}
          ref: ${{ steps.dependencies.outputs.quakec_ref }}
          path: test-dependencies/quakec
          persist-credentials: false
      - name: Checkout assets
        if: steps.dependencies.outputs.assets_ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.dependencies.outputs.assets_repository }}
          ref: ${{ steps.dependencies.outputs.assets_ref }}
          path: test-dependencies/assets
          persist-credentials: false
      - name: Install content build dependencies
        if: steps.dependencies.outputs.has_overrides == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git libicu-dev python3 python3-pip unzip wget zip
          wget -q https://raw.githubusercontent.com/nzp-team/QCHashTableGenerator/main/requirements.txt
          python3 -m pip install -r requirements.txt --break-system-packages
      - name: Build QuakeC override
        if: steps.dependencies.outputs.quakec_ref != ''
        run: |
          bash test-dependencies/quakec/tools/qc-compiler-gnu.sh
          mkdir -p test-overrides/quakec
          cp test-dependencies/quakec/build/standard/progs.dat test-overrides/quakec/progs.dat
      - name: Build assets override
        if: steps.dependencies.outputs.assets_ref != ''
        run: |
          git clone --recursive https://github.com/nzp-team/spawn-zone-tool.git test-dependencies/spawn-zone-tool
          python3 -m pip install -r test-dependencies/spawn-zone-tool/requirements.txt --break-system-packages
          bash "${GITHUB_WORKSPACE}/test-dependencies/assets/tools/compile-wads.sh"
          bash "${GITHUB_WORKSPACE}/test-dependencies/assets/tools/compile-maps.sh" --full --zone-tool-path "${GITHUB_WORKSPACE}/test-dependencies/spawn-zone-tool"
          bash "${GITHUB_WORKSPACE}/test-dependencies/assets/tools/assemble-assets.sh"
          mkdir -p test-overrides/assets/{linux,windows,ctr}
          unzip -oq test-dependencies/assets/tmp/pc-nzp-assets.zip -d test-overrides/assets/pc-package
          cp -a test-overrides/assets/pc-package/nzp/. test-overrides/assets/linux/
          cp -a test-overrides/assets/pc-package/nzp/. test-overrides/assets/windows/
          unzip -oq test-dependencies/assets/tmp/3ds-nzp-assets.zip -d test-overrides/assets/ctr-package
          cp -a test-overrides/assets/ctr-package/nzportable/nzp/. test-overrides/assets/ctr/
          rm -rf test-overrides/assets/pc-package test-overrides/assets/ctr-package
      - name: Log repository overrides
        env:
          QUAKEC_REF: ${{ steps.dependencies.outputs.quakec_ref }}
          QUAKEC_REPOSITORY: ${{ steps.dependencies.outputs.quakec_repository }}
          ASSETS_REF: ${{ steps.dependencies.outputs.assets_ref }}
          ASSETS_REPOSITORY: ${{ steps.dependencies.outputs.assets_repository }}
        run: |
          {
            echo "### Vril Pull Request Test Overrides"
            echo
            if [[ -n "${QUAKEC_REF}" ]]; then
              echo "* QuakeC: \`${QUAKEC_REPOSITORY}@$(git -C test-dependencies/quakec rev-parse HEAD)\` (requested \`${QUAKEC_REF}\`)"
            else
              echo "* QuakeC: N/A"
            fi
            if [[ -n "${ASSETS_REF}" ]]; then
              echo "* Assets: \`${ASSETS_REPOSITORY}@$(git -C test-dependencies/assets rev-parse HEAD)\` (requested \`${ASSETS_REF}\`)"
            else
              echo "* Assets: N/A"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload test content overrides
        if: steps.dependencies.outputs.has_overrides == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-content-overrides
          path: test-overrides/
          retention-days: 1
  Pull-Request-Test-3DS:
    if: github.event_name == 'pull_request'
    name: 3DS ${{ matrix.mode }} ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-3DSX, prepare-toolbox-test-content]
    strategy:
      fail-fast: false
      matrix:
        mode: [old, new]
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
      options: --shm-size=8192m
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select Vril PR merge commit
        env:
          PR_MERGE_REF: ${{ github.ref }}
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C /workspace/repos/vril-engine fetch origin "$PR_MERGE_REF"
          git -C /workspace/repos/vril-engine checkout --detach FETCH_HEAD
          test "$(git -C /workspace/repos/vril-engine rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git -C /workspace/repos/vril-engine rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
      - name: Download 3DS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ctr-nzp-3dsx
          path: /workspace/vril-test-artifact
      - name: Download Test Content Overrides
        if: needs['prepare-toolbox-test-content'].outputs.has_overrides == 'true'
        uses: actions/download-artifact@v4
        with:
          name: toolbox-pr-test-content-overrides
          path: /workspace/vril-test-overrides
      - name: Run test
        env:
          ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/ctr
          QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
          CTR_MODE: ${{ matrix.mode }}
          VRIL_TEST: ${{ matrix.test }}
        run: /entrypoint.sh test-vril --platform ctr --test "$VRIL_TEST" --mode "$CTR_MODE" --binary /workspace/vril-test-artifact/nzportable.3dsx
      - name: Upload Failure Artifact
        id: ctr_failure_artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctr-${{ matrix.mode }}-${{ matrix.test }}-pr-failures
          path: /workspace/repos/vril-engine/testing/working/fail/
          if-no-files-found: ignore
          retention-days: 14
      - name: Add Failure Summary
        if: failure() && steps.ctr_failure_artifact.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.ctr_failure_artifact.outputs.artifact-url }}
          CTR_MODE: ${{ matrix.mode }}
          VRIL_TEST: ${{ matrix.test }}
        run: |
          {
            echo "## 3DS $CTR_MODE $VRIL_TEST PR Test Failed"
            echo ""
            cat /workspace/repos/vril-engine/testing/working/fail/summary.md
            echo ""
            echo "[Failure Artifact]($ARTIFACT_URL)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
  Pull-Request-Test-PSP:
    if: github.event_name == 'pull_request'
    name: PSP ${{ matrix.mode }} ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-EBOOT, prepare-toolbox-test-content]
    strategy:
      fail-fast: false
      matrix:
        mode: [fat, slim]
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
      options: --shm-size=8192m
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select Vril PR merge commit
        env:
          PR_MERGE_REF: ${{ github.ref }}
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C /workspace/repos/vril-engine fetch origin "$PR_MERGE_REF"
          git -C /workspace/repos/vril-engine checkout --detach FETCH_HEAD
          test "$(git -C /workspace/repos/vril-engine rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git -C /workspace/repos/vril-engine rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
      - name: Download PSP Artifact
        uses: actions/download-artifact@v4
        with:
          name: psp-nzp-eboot
          path: /workspace/vril-test-artifact
      - name: Download Test Content Overrides
        if: needs['prepare-toolbox-test-content'].outputs.has_overrides == 'true'
        uses: actions/download-artifact@v4
        with:
          name: toolbox-pr-test-content-overrides
          path: /workspace/vril-test-overrides
      - name: Run test
        env:
          ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/psp
          QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
          PSP_MODE: ${{ matrix.mode }}
          VRIL_TEST: ${{ matrix.test }}
        run: /entrypoint.sh test-vril --platform psp --test "$VRIL_TEST" --mode "$PSP_MODE" --binary /workspace/vril-test-artifact/EBOOT.PBP
      - name: Upload Failure Artifact
        id: psp_failure_artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: psp-${{ matrix.mode }}-${{ matrix.test }}-pr-failures
          path: /workspace/repos/vril-engine/testing/working/fail/
          if-no-files-found: ignore
          retention-days: 14
      - name: Add Failure Summary
        if: failure() && steps.psp_failure_artifact.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.psp_failure_artifact.outputs.artifact-url }}
          PSP_MODE: ${{ matrix.mode }}
          VRIL_TEST: ${{ matrix.test }}
        run: |
          {
            echo "## PSP $PSP_MODE $VRIL_TEST PR Test Failed"
            echo ""
            cat /workspace/repos/vril-engine/testing/working/fail/summary.md
            echo ""
            echo "[Failure Artifact]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
  prepare-toolbox-test-content:
    if: github.event_name == 'pull_request'
    name: Prepare Toolbox Test Content
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
    outputs:
      has_overrides: ${{ steps.refs.outputs.has_overrides }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve dependency overrides
        id: refs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          quakec_ref=$(sed -nE 's/^[[:space:]]*quakec_ref=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n 1)
          assets_ref=$(sed -nE 's/^[[:space:]]*assets_ref=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n 1)
          {
            echo "quakec_ref=$quakec_ref"
            echo "assets_ref=$assets_ref"
            if [ -n "$quakec_ref" ] || [ -n "$assets_ref" ]; then
              echo 'has_overrides=true'
            else
              echo 'has_overrides=false'
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Toolbox Fetch
        if: steps.refs.outputs.has_overrides == 'true'
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Build dependency overrides
        if: steps.refs.outputs.has_overrides == 'true'
        env:
          QUAKEC_REF: ${{ steps.refs.outputs.quakec_ref }}
          ASSETS_REF: ${{ steps.refs.outputs.assets_ref }}
          PR_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          if [ -n "$QUAKEC_REF" ]; then
            git -C /workspace/repos/quakec fetch "https://github.com/${PR_HEAD_OWNER}/quakec.git" "$QUAKEC_REF"
            git -C /workspace/repos/quakec checkout --detach FETCH_HEAD
            /entrypoint.sh build-quakec
            mkdir -p /workspace/vril-test-overrides/quakec
            cp /workspace/repos/quakec/build/standard/progs.dat /workspace/vril-test-overrides/quakec/progs.dat
            echo "QuakeC override: \`${PR_HEAD_OWNER}/quakec@$(git -C /workspace/repos/quakec rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ASSETS_REF" ]; then
            git -C /workspace/repos/assets fetch "https://github.com/${PR_HEAD_OWNER}/assets.git" "$ASSETS_REF"
            git -C /workspace/repos/assets checkout --detach FETCH_HEAD
            /entrypoint.sh build-wads
            /entrypoint.sh build-map --full
            /entrypoint.sh build-assets
            mkdir -p /workspace/vril-test-overrides/assets/linux
            cp -a /workspace/repos/assets/tmp/pc/nzp/. /workspace/vril-test-overrides/assets/linux/
            mkdir -p /workspace/vril-test-overrides/assets/windows
            cp -a /workspace/repos/assets/tmp/pc/nzp/. /workspace/vril-test-overrides/assets/windows/
            mkdir -p /workspace/vril-test-overrides/assets/psp
            cp -a /workspace/repos/assets/tmp/psp/nzportable/nzp/. /workspace/vril-test-overrides/assets/psp/
            mkdir -p /workspace/vril-test-overrides/assets/ctr
            cp -a /workspace/repos/assets/tmp/ctr/nzportable/nzp/. /workspace/vril-test-overrides/assets/ctr/
            echo "Assets override: \`${PR_HEAD_OWNER}/assets@$(git -C /workspace/repos/assets rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test content overrides
        if: steps.refs.outputs.has_overrides == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-pr-test-content-overrides
          path: /workspace/vril-test-overrides/
          if-no-files-found: error
          retention-days: 1

  Pull-Request-Test-Linux-Toolbox:
    if: github.event_name == 'pull_request'
    name: Linux ${{ matrix.arch }} ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-Linux-Toolbox, prepare-toolbox-test-content]
    runs-on: ${{ contains(fromJSON('["arm64","armhf"]'), matrix.arch) && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
      options: --shm-size=8192m
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        arch: [x86_64, x86, arm64, armhf]
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: ${{ contains(fromJSON('["arm64","armhf"]'), matrix.arch) && 'arm64' || 'x86_64' }}
        run: /entrypoint.sh fetch
      - name: Select Vril PR merge commit
        env:
          PR_MERGE_REF: ${{ github.ref }}
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C /workspace/repos/vril-engine fetch origin "$PR_MERGE_REF"
          git -C /workspace/repos/vril-engine checkout --detach FETCH_HEAD
          test "$(git -C /workspace/repos/vril-engine rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git -C /workspace/repos/vril-engine rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-nzp-sdl
          path: /workspace/vril-test-artifact
      - name: Download Test Content Overrides
        if: needs['prepare-toolbox-test-content'].outputs.has_overrides == 'true'
        uses: actions/download-artifact@v4
        with:
          name: toolbox-pr-test-content-overrides
          path: /workspace/vril-test-overrides
      - name: Run test
        env:
          ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/linux
          QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
          VRIL_TEST: ${{ matrix.test }}
        run: /entrypoint.sh test-vril --platform linux --test "$VRIL_TEST" --binary /workspace/vril-test-artifact/nzportable
      - name: Upload Failure Artifact
        id: linux_x86_64_failure_artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.test }}-pr-failures
          path: /workspace/repos/vril-engine/testing/working/fail/
          if-no-files-found: ignore
          retention-days: 14
      - name: Add Failure Summary
        if: failure() && steps.linux_x86_64_failure_artifact.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.linux_x86_64_failure_artifact.outputs.artifact-url }}
        run: |
          {
            echo "## Linux ${{ matrix.arch }} ${{ matrix.test }} PR Test Failed"
            echo ""
            cat /workspace/repos/vril-engine/testing/working/fail/summary.md
            echo ""
            echo "[Failure Artifact](${ARTIFACT_URL})"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
  Pull-Request-Test-Windows:
    if: github.event_name == 'pull_request'
    name: Windows ${{ matrix.arch }} ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-Windows, prepare-toolbox-test-content]
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64]
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
      options: --shm-size=8192m
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select Vril PR merge commit
        env:
          PR_MERGE_REF: ${{ github.ref }}
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C /workspace/repos/vril-engine fetch origin "$PR_MERGE_REF"
          git -C /workspace/repos/vril-engine checkout --detach FETCH_HEAD
          test "$(git -C /workspace/repos/vril-engine rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git -C /workspace/repos/vril-engine rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-nzp-sdl
          path: /workspace/vril-test-artifact
      - name: Download Test Content Overrides
        if: needs['prepare-toolbox-test-content'].outputs.has_overrides == 'true'
        uses: actions/download-artifact@v4
        with:
          name: toolbox-pr-test-content-overrides
          path: /workspace/vril-test-overrides
      - name: Run test
        env:
          ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/windows
          QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
          VRIL_TEST: ${{ matrix.test }}
        run: /entrypoint.sh test-vril --platform windows --test "$VRIL_TEST" --binary /workspace/vril-test-artifact/nzportable.exe --reference-platform linux
      - name: Upload Failure Artifact
        id: windows_failure_artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-${{ matrix.test }}-pr-failures
          path: /workspace/repos/vril-engine/testing/working/fail/
          if-no-files-found: ignore
          retention-days: 14
      - name: Add Failure Summary
        if: failure() && steps.windows_failure_artifact.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.windows_failure_artifact.outputs.artifact-url }}
          WINDOWS_ARCH: ${{ matrix.arch }}
          VRIL_TEST: ${{ matrix.test }}
        run: |
          {
            echo "## Windows $WINDOWS_ARCH $VRIL_TEST PR Test Failed"
            echo ""
            cat /workspace/repos/vril-engine/testing/working/fail/summary.md
            echo ""
            echo "[Failure Artifact]($ARTIFACT_URL)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
  Unify-and-Release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [Compile-Linux-Toolbox, Compile-Windows, Compile-EBOOT, Compile-3DSX, Compile-TNS, Compile-VPK, Compile-NRO]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Wait for GitHub to keep up..
        run: sleep 2s
        shell: bash
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./
      - name: Turn Artifacts into .ZIP archives
        run: |
          zip -r -j psp-nzp-eboot.zip psp-nzp-eboot/*
          zip -r -j ctr-nzp-3dsx.zip ctr-nzp-3dsx/*
          zip -r -j nspire-nzp-tns.zip nspire-nzp-tns/*
          zip -r -j psp2-nzp-vpk.zip psp2-nzp-vpk/*
          zip -r -j nx-nzp-nro.zip nx-nzp-nro/*
          zip -r -j linux-x86-nzp-sdl.zip linux-x86-nzp-sdl/*
          zip -r -j linux-x86_64-nzp-sdl.zip linux-x86_64-nzp-sdl/*
          zip -r -j linux-arm64-nzp-sdl.zip linux-arm64-nzp-sdl/*
          zip -r -j linux-armhf-nzp-sdl.zip linux-armhf-nzp-sdl/*
          zip -r -j windows-x86-nzp-sdl.zip windows-x86-nzp-sdl/*
          zip -r -j windows-x86_64-nzp-sdl.zip windows-x86_64-nzp-sdl/*
      - name: Generate Build Date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d-%H-%M-%S')"
      - name: Delete Old Release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          delete_release: true
          tag_name: bleeding-edge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: bleeding-edge
          release_name: Automated Release ${{ steps.date.outputs.date }}
          body: |
            This is a **bleeding edge** NZ:P PSP/PSVITA/3DS/NSPIRE/PC release, stability is not guarenteed.

            To install:
            - Grab the .ZIP archive for your platform
            - PSP: Extract the `EBOOT.PBP` to `/PSP/GAME/nzportable/`
            - PS VITA: Install `nzportable.vpk` using VitaShell.
            - 3DS: Extract `nzportable.3dsx` to `/3ds/nzportable/`.
            - NSPIRE: Sync `nzportable.tns` to `/`.
            - PC: Extract the archive for your CPU architecture and run `nzportable`.
          draft: true
          prerelease: false
      - name: Upload PSP Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./psp-nzp-eboot.zip
          asset_name: psp-nzp-eboot.zip
          asset_content_type: application/zip
      - name: Upload 3DS Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./ctr-nzp-3dsx.zip
          asset_name: ctr-nzp-3dsx.zip
          asset_content_type: application/zip
      - name: Upload NSPIRE Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./nspire-nzp-tns.zip
          asset_name: nspire-nzp-tns.zip
          asset_content_type: application/zip
      - name: Upload PSVITA Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./psp2-nzp-vpk.zip
          asset_name: psp2-nzp-vpk.zip
          asset_content_type: application/zip
      - name: Upload Nintendo Switch Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./nx-nzp-nro.zip
          asset_name: nx-nzp-nro.zip
          asset_content_type: application/zip
      - name: Upload Linux x86 Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./linux-x86-nzp-sdl.zip
          asset_name: linux-x86-nzp-sdl.zip
          asset_content_type: application/zip
      - name: Upload Linux x86_64 Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./linux-x86_64-nzp-sdl.zip
          asset_name: linux-x86_64-nzp-sdl.zip
          asset_content_type: application/zip
      - name: Upload Linux arm64 Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./linux-arm64-nzp-sdl.zip
          asset_name: linux-arm64-nzp-sdl.zip
          asset_content_type: application/zip
      - name: Upload Linux armhf Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./linux-armhf-nzp-sdl.zip
          asset_name: linux-armhf-nzp-sdl.zip
          asset_content_type: application/zip
      - name: Upload Windows x86 Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./windows-x86-nzp-sdl.zip
          asset_name: windows-x86-nzp-sdl.zip
          asset_content_type: application/zip
      - name: Upload Windows x86_64 Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./windows-x86_64-nzp-sdl.zip
          asset_name: windows-x86_64-nzp-sdl.zip
          asset_content_type: application/zip
      - name: Publish Release
        uses: StuYarrow/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ steps.create_release.outputs.id }}
