name: Build
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  resolve-toolbox:
    name: Pull Toolbox
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Resolve Toolbox Image
        id: image
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          toolbox_image=$(sed -nE 's/^[[:space:]]*toolbox_image=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n 1)
          if [ -n "$toolbox_image" ]; then
            if [[ ! "$toolbox_image" =~ ^ghcr\.io/[A-Za-z0-9-]+/toolbox(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}|@sha256:[0-9a-f]{64})$ ]]; then
              echo "Invalid Toolbox image: $toolbox_image" >&2
              exit 1
            fi
            image="$toolbox_image"
          else
            image='ghcr.io/nzp-team/toolbox:main'
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Toolbox Image: \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  discover-tests:
    if: github.event_name == 'pull_request'
    name: Discover tests
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: List tests
        id: tests
        env:
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          echo "Vril PR head: \`$PR_HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tested merge commit: \`$PR_MERGE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          tests=$(find testing/tests -maxdepth 1 -type f -name '*.sh' ! -name 'generate-source.sh' | sed -E 's@.*/([^/]+)\.sh$@\1@' | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')
          test "$tests" != '[]' && echo "tests=$tests" >> "$GITHUB_OUTPUT"

  Compile-linux-x86_64:
    if: &build_condition ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
    name: Compile Linux (x86_64)
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: &toolbox_container
      image: ${{ needs.resolve-toolbox.outputs.image }}
    defaults: &bash_defaults
      run:
        shell: bash
    env:
      VRIL_BUILD_TARGET: linux-x86_64
      VRIL_ARTIFACT: linux-x86_64-nzp-sdl
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/sdl/nzportable
    steps: &compile_steps
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Select Vril commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          VRIL_REF: ${{ github.ref }}
          VRIL_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git -C /workspace/repos/vril-engine fetch origin "$VRIL_REF"
            git -C /workspace/repos/vril-engine checkout --detach FETCH_HEAD
            test "$(git -C /workspace/repos/vril-engine rev-parse HEAD)" = "$VRIL_SHA"
            test "$(git -C /workspace/repos/vril-engine rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
          else
            git -C /workspace/repos/vril-engine fetch origin main
            git -C /workspace/repos/vril-engine checkout --detach "$VRIL_SHA"
          fi
      - name: Build
        run: /entrypoint.sh build-vril --target "$VRIL_BUILD_TARGET" -- WERROR=1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VRIL_ARTIFACT }}
          path: ${{ env.VRIL_ARTIFACT_PATHS }}
          if-no-files-found: error

  Compile-linux-x86:
    if: *build_condition
    name: Compile Linux (x86)
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: linux-x86
      VRIL_ARTIFACT: linux-x86-nzp-sdl
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/sdl/x86/nzportable
    steps: *compile_steps

  Compile-linux-arm64:
    if: *build_condition
    name: Compile Linux (arm64)
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: linux-arm64
      VRIL_ARTIFACT: linux-arm64-nzp-sdl
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/sdl/arm64/nzportable
    steps: *compile_steps

  Compile-linux-armhf:
    if: *build_condition
    name: Compile Linux (armhf)
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: linux-armhf
      VRIL_ARTIFACT: linux-armhf-nzp-sdl
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/sdl/armhf/nzportable
    steps: *compile_steps

  Compile-windows-x86:
    if: *build_condition
    name: Compile Windows (x86)
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: windows-x86
      VRIL_ARTIFACT: windows-x86-nzp-sdl
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/sdl/windows-x86/nzportable.exe
    steps: *compile_steps

  Compile-windows-x86_64:
    if: *build_condition
    name: Compile Windows (x86_64)
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: windows-x86_64
      VRIL_ARTIFACT: windows-x86_64-nzp-sdl
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/sdl/windows-x86_64/nzportable.exe
    steps: *compile_steps

  Compile-xbox:
    if: *build_condition
    name: Compile Xbox
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: xbox
      VRIL_ARTIFACT: xbox-nzp-xbe
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/xbox/nzportable/default.xbe
    steps: *compile_steps

  Compile-xbox360:
    if: *build_condition
    name: Compile Xbox 360
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: xbox360
      VRIL_ARTIFACT: xbox360-nzp-elf
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/xbox360/xenon.elf
    steps: *compile_steps

  Compile-ps2:
    if: *build_condition
    name: Compile PlayStation 2
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: ps2
      VRIL_ARTIFACT: ps2-nzp-elf
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/ps2/nzportable.elf
    steps: *compile_steps

  Compile-psp:
    if: *build_condition
    name: Compile PlayStation Portable
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: psp
      VRIL_ARTIFACT: psp-nzp-eboot
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/psp/bin/EBOOT.PBP
    steps: *compile_steps

  Compile-3ds:
    if: *build_condition
    name: Compile Nintendo 3DS
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: 3ds
      VRIL_ARTIFACT: ctr-nzp-3dsx
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/ctr/bin/nzportable.3dsx
    steps: *compile_steps

  Compile-nspire:
    if: *build_condition
    name: Compile TI-Nspire
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: nspire
      VRIL_ARTIFACT: nspire-nzp-tns
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/nspire/bin/nzportable.tns
    steps: *compile_steps

  Compile-vita:
    if: *build_condition
    name: Compile PlayStation VITA
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: vita
      VRIL_ARTIFACT: psp2-nzp-vpk
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/psp2/nzportable.vpk
    steps: *compile_steps

  Compile-ps4:
    if: *build_condition
    name: Compile PlayStation 4
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: ps4
      VRIL_ARTIFACT: ps4-nzp-pkg
      VRIL_ARTIFACT_PATHS: /workspace/repos/vril-engine/build/ps4/nzportable.pkg
    steps: *compile_steps

  Compile-switch:
    if: *build_condition
    name: Compile Nintendo Switch
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container: *toolbox_container
    defaults: *bash_defaults
    env:
      VRIL_BUILD_TARGET: switch
      VRIL_ARTIFACT: nx-nzp-nro
      VRIL_ARTIFACT_PATHS: |
        /workspace/repos/vril-engine/build/nx/bin/nzportable.nro
        /workspace/repos/vril-engine/build/nx/bin/nzportable.nacp
    steps: *compile_steps

  Test-linux-x86_64:
    if: github.event_name == 'pull_request'
    name: Linux (x86_64) ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-linux-x86_64, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: [""]
    container: &test_container
      image: ${{ needs.resolve-toolbox.outputs.image }}
      options: --shm-size=8192m
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: linux
      VRIL_HOST_ARCH: x86_64
      VRIL_ARTIFACT: linux-x86_64-nzp-sdl
      VRIL_BINARY: nzportable
      VRIL_REFERENCE: ''
      VRIL_TEST_TARGET: linux-x86_64
      VRIL_TEST_NAME: Linux (x86_64)
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/linux
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: &pr_steps
      - name: Toolbox Fetch
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: ${{ env.VRIL_HOST_ARCH }}
        run: /entrypoint.sh fetch
      - name: Select Vril PR merge commit
        env:
          PR_MERGE_REF: ${{ github.ref }}
          PR_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C /workspace/repos/vril-engine fetch origin "$PR_MERGE_REF"
          git -C /workspace/repos/vril-engine checkout --detach FETCH_HEAD
          test "$(git -C /workspace/repos/vril-engine rev-parse HEAD)" = "$PR_MERGE_SHA"
          test "$(git -C /workspace/repos/vril-engine rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
      - name: Download Engine Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VRIL_ARTIFACT }}
          path: /workspace/vril-test-artifact
      - name: Download Test Content Overrides
        if: needs['prepare-toolbox-test-content'].outputs.has_overrides == 'true'
        uses: actions/download-artifact@v4
        with:
          name: toolbox-pr-test-content-overrides
          path: /workspace/vril-test-overrides
      - name: Prepare BIOS
        if: env.VRIL_PLATFORM == 'ps2'
        env:
          PS2_BIOS_URL: ${{ secrets.PS2_BIOS_URL }}
        run: |
          test -n "$PS2_BIOS_URL" || { echo 'PS2_BIOS_URL is not configured.' >&2; exit 1; }
          curl --fail --silent --show-error --location "$PS2_BIOS_URL" --output /tmp/ps2-bios.bin
          echo 'PS2_BIOS=/tmp/ps2-bios.bin' >> "$GITHUB_ENV"
      - name: Prepare Xbox firmware and HDD
        if: env.VRIL_PLATFORM == 'xbox'
        env:
          XBOX_BIOS_URL: ${{ secrets.XBOX_BIOS_URL }}
        run: |
          test -n "$XBOX_BIOS_URL" || { echo 'XBOX_BIOS_URL is not configured.' >&2; exit 1; }
          mkdir -p "$XEMU_FILES"
          curl --fail --silent --show-error --location --retry 3 "$XBOX_BIOS_URL" --output "$XEMU_FILES/bios.rar"
      - name: Run test
        env:
          VRIL_TEST: ${{ matrix.test }}
          VRIL_MODE: ${{ matrix.mode }}
        run: |
          arguments=(--platform "$VRIL_PLATFORM" --test "$VRIL_TEST" --binary "/workspace/vril-test-artifact/$VRIL_BINARY")
          if [ -n "$VRIL_MODE" ]; then
            arguments+=(--mode "$VRIL_MODE")
          fi
          if [ -n "$VRIL_REFERENCE" ]; then
            arguments+=(--reference-platform "$VRIL_REFERENCE")
          fi
          /entrypoint.sh test-vril "${arguments[@]}"
      - name: Remove BIOS
        if: always() && env.VRIL_PLATFORM == 'ps2'
        run: rm -f /tmp/ps2-bios.bin /workspace/repos/vril-engine/testing/working/PCSX2/bios/ps2.bin
      - name: Remove Xbox firmware and HDD
        if: always() && env.VRIL_PLATFORM == 'xbox'
        run: rm -f "$XEMU_FILES/bios.rar" "$XEMU_FILES/bios.bin" "$XEMU_FILES/mcpx_1.0.bin" "$XEMU_FILES/xbox_hdd.qcow2" /workspace/repos/vril-engine/testing/working/xbox_hdd.qcow2
      - name: Upload Failure Artifact
        id: failure_artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VRIL_TEST_TARGET }}-${{ matrix.test }}-pr-failures
          path: /workspace/repos/vril-engine/testing/working/fail/
          if-no-files-found: ignore
          retention-days: 14
      - name: Add Failure Summary
        if: failure() && steps.failure_artifact.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.failure_artifact.outputs.artifact-url }}
          PLATFORM_NAME: ${{ env.VRIL_TEST_NAME }}
          VRIL_TEST: ${{ matrix.test }}
        run: |
          {
            echo "## $PLATFORM_NAME $VRIL_TEST PR Test Failed"
            echo ""
            cat /workspace/repos/vril-engine/testing/working/fail/summary.md
            echo ""
            echo "[Failure Artifact]($ARTIFACT_URL)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  Test-linux-x86:
    if: github.event_name == 'pull_request'
    name: Linux (x86) ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-linux-x86, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: [""]
    container: *test_container
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: linux
      VRIL_HOST_ARCH: x86_64
      VRIL_ARTIFACT: linux-x86-nzp-sdl
      VRIL_BINARY: nzportable
      VRIL_REFERENCE: ''
      VRIL_TEST_TARGET: linux-x86
      VRIL_TEST_NAME: Linux (x86)
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/linux
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: *pr_steps

  Test-linux-arm64:
    if: github.event_name == 'pull_request'
    name: Linux (arm64) ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-linux-arm64, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: [""]
    container: *test_container
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: linux
      VRIL_HOST_ARCH: arm64
      VRIL_ARTIFACT: linux-arm64-nzp-sdl
      VRIL_BINARY: nzportable
      VRIL_REFERENCE: ''
      VRIL_TEST_TARGET: linux-arm64
      VRIL_TEST_NAME: Linux (arm64)
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/linux
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: *pr_steps

  Test-linux-armhf:
    if: github.event_name == 'pull_request'
    name: Linux (armhf) ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-linux-armhf, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: [""]
    container: *test_container
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: linux
      VRIL_HOST_ARCH: arm64
      VRIL_ARTIFACT: linux-armhf-nzp-sdl
      VRIL_BINARY: nzportable
      VRIL_REFERENCE: ''
      VRIL_TEST_TARGET: linux-armhf
      VRIL_TEST_NAME: Linux (armhf)
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/linux
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: *pr_steps

  Test-windows-x86:
    if: github.event_name == 'pull_request'
    name: Windows (x86) ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-windows-x86, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: [""]
    container: *test_container
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: windows
      VRIL_HOST_ARCH: x86_64
      VRIL_ARTIFACT: windows-x86-nzp-sdl
      VRIL_BINARY: nzportable.exe
      VRIL_REFERENCE: linux
      VRIL_TEST_TARGET: windows-x86
      VRIL_TEST_NAME: Windows (x86)
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/windows
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: *pr_steps

  Test-windows-x86_64:
    if: github.event_name == 'pull_request'
    name: Windows (x86_64) ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-windows-x86_64, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: [""]
    container: *test_container
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: windows
      VRIL_HOST_ARCH: x86_64
      VRIL_ARTIFACT: windows-x86_64-nzp-sdl
      VRIL_BINARY: nzportable.exe
      VRIL_REFERENCE: linux
      VRIL_TEST_TARGET: windows-x86_64
      VRIL_TEST_NAME: Windows (x86_64)
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/windows
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: *pr_steps

  Test-xbox:
    if: github.event_name == 'pull_request'
    name: Xbox ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-xbox, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: [""]
    container: *test_container
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: xbox
      VRIL_HOST_ARCH: x86_64
      VRIL_ARTIFACT: xbox-nzp-xbe
      VRIL_BINARY: default.xbe
      VRIL_REFERENCE: ''
      VRIL_TEST_TARGET: xbox
      VRIL_TEST_NAME: Xbox
      XEMU_FILES: /tmp/xemu-files
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/ctr
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: *pr_steps

  Test-xbox360:
    if: github.event_name == 'pull_request'
    name: Xbox 360 ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-xbox360, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: [""]
    container: *test_container
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: xbox360
      VRIL_HOST_ARCH: x86_64
      VRIL_ARTIFACT: xbox360-nzp-elf
      VRIL_BINARY: xenon.elf
      VRIL_REFERENCE: ''
      VRIL_TEST_TARGET: xbox360
      VRIL_TEST_NAME: Xbox 360
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/ctr
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: *pr_steps

  Test-ps2:
    if: github.event_name == 'pull_request'
    name: PlayStation 2 ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-ps2, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: [""]
    container: *test_container
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: ps2
      VRIL_HOST_ARCH: x86_64
      VRIL_ARTIFACT: ps2-nzp-elf
      VRIL_BINARY: nzportable.elf
      VRIL_REFERENCE: ''
      VRIL_TEST_TARGET: ps2
      VRIL_TEST_NAME: PlayStation 2
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/ctr
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: *pr_steps

  Test-psp:
    if: github.event_name == 'pull_request'
    name: PlayStation Portable ${{ matrix.mode }} ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-psp, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: ["fat", "slim"]
    container: *test_container
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: psp
      VRIL_HOST_ARCH: x86_64
      VRIL_ARTIFACT: psp-nzp-eboot
      VRIL_BINARY: EBOOT.PBP
      VRIL_REFERENCE: ''
      VRIL_TEST_TARGET: psp-${{ matrix.mode }}
      VRIL_TEST_NAME: PlayStation Portable ${{ matrix.mode }}
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/psp
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: *pr_steps

  Test-3ds:
    if: github.event_name == 'pull_request'
    name: Nintendo 3DS ${{ matrix.mode }} ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-3ds, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: ["old", "new"]
    container: *test_container
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: ctr
      VRIL_HOST_ARCH: x86_64
      VRIL_ARTIFACT: ctr-nzp-3dsx
      VRIL_BINARY: nzportable.3dsx
      VRIL_REFERENCE: ''
      VRIL_TEST_TARGET: ctr-${{ matrix.mode }}
      VRIL_TEST_NAME: Nintendo 3DS ${{ matrix.mode }}
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/ctr
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: *pr_steps

  Test-ps4:
    if: github.event_name == 'pull_request'
    name: PlayStation 4 ${{ matrix.test }} Pull Request Test
    needs: [resolve-toolbox, discover-tests, Compile-ps4, prepare-toolbox-test-content]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
        mode: [""]
    container: *test_container
    defaults: *bash_defaults
    env:
      VRIL_PLATFORM: ps4
      VRIL_HOST_ARCH: x86_64
      VRIL_ARTIFACT: ps4-nzp-pkg
      VRIL_BINARY: nzportable.pkg
      VRIL_REFERENCE: ''
      VRIL_TEST_TARGET: ps4
      VRIL_TEST_NAME: PlayStation 4
      ASSETS_OVERRIDE_DIRECTORY: /workspace/vril-test-overrides/assets/ctr
      QUAKEC_OVERRIDE_FILE: /workspace/vril-test-overrides/quakec/progs.dat
    steps: *pr_steps

  prepare-toolbox-test-content:
    if: github.event_name == 'pull_request'
    name: Prepare Toolbox Test Content
    needs: resolve-toolbox
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.resolve-toolbox.outputs.image }}
    outputs:
      has_overrides: ${{ steps.refs.outputs.has_overrides }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve dependency overrides
        id: refs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          quakec_ref=$(sed -nE 's/^[[:space:]]*quakec_ref=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n 1)
          assets_ref=$(sed -nE 's/^[[:space:]]*assets_ref=([^[:space:]]+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n 1)
          {
            echo "quakec_ref=$quakec_ref"
            echo "assets_ref=$assets_ref"
            if [ -n "$quakec_ref" ] || [ -n "$assets_ref" ]; then
              echo 'has_overrides=true'
            else
              echo 'has_overrides=false'
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Toolbox Fetch
        if: steps.refs.outputs.has_overrides == 'true'
        env:
          TOOLBOX_HOST_OS: Linux
          TOOLBOX_HOST_ARCH: x86_64
        run: /entrypoint.sh fetch
      - name: Build dependency overrides
        if: steps.refs.outputs.has_overrides == 'true'
        env:
          QUAKEC_REF: ${{ steps.refs.outputs.quakec_ref }}
          ASSETS_REF: ${{ steps.refs.outputs.assets_ref }}
          PR_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          if [ -n "$QUAKEC_REF" ]; then
            git -C /workspace/repos/quakec fetch "https://github.com/${PR_HEAD_OWNER}/quakec.git" "$QUAKEC_REF"
            git -C /workspace/repos/quakec checkout --detach FETCH_HEAD
            /entrypoint.sh build-quakec
            mkdir -p /workspace/vril-test-overrides/quakec
            cp /workspace/repos/quakec/build/standard/progs.dat /workspace/vril-test-overrides/quakec/progs.dat
            echo "QuakeC override: \`${PR_HEAD_OWNER}/quakec@$(git -C /workspace/repos/quakec rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ASSETS_REF" ]; then
            git -C /workspace/repos/assets fetch "https://github.com/${PR_HEAD_OWNER}/assets.git" "$ASSETS_REF"
            git -C /workspace/repos/assets checkout --detach FETCH_HEAD
            /entrypoint.sh build-wads
            /entrypoint.sh build-map --full
            /entrypoint.sh build-assets
            mkdir -p /workspace/vril-test-overrides/assets/linux
            cp -a /workspace/repos/assets/tmp/pc/nzp/. /workspace/vril-test-overrides/assets/linux/
            mkdir -p /workspace/vril-test-overrides/assets/windows
            cp -a /workspace/repos/assets/tmp/pc/nzp/. /workspace/vril-test-overrides/assets/windows/
            mkdir -p /workspace/vril-test-overrides/assets/psp
            cp -a /workspace/repos/assets/tmp/psp/nzportable/nzp/. /workspace/vril-test-overrides/assets/psp/
            mkdir -p /workspace/vril-test-overrides/assets/ctr
            cp -a /workspace/repos/assets/tmp/ctr/nzportable/nzp/. /workspace/vril-test-overrides/assets/ctr/
            echo "Assets override: \`${PR_HEAD_OWNER}/assets@$(git -C /workspace/repos/assets rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test content overrides
        if: steps.refs.outputs.has_overrides == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-pr-test-content-overrides
          path: /workspace/vril-test-overrides/
          if-no-files-found: error
          retention-days: 1

  Create-Release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [Compile-linux-x86_64, Compile-linux-x86, Compile-linux-arm64, Compile-linux-armhf, Compile-windows-x86, Compile-windows-x86_64, Compile-xbox, Compile-xbox360, Compile-ps2, Compile-psp, Compile-3ds, Compile-nspire, Compile-vita, Compile-ps4, Compile-switch]
    outputs:
      id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for GitHub to keep up..
        run: sleep 2s
        shell: bash
      - name: Generate Build Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_OUTPUT"
      - name: Delete Old Release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          delete_release: true
          tag_name: bleeding-edge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: bleeding-edge
          release_name: Automated Release ${{ steps.date.outputs.date }}
          body: |
            This is a **bleeding edge** Vril Engine release, stability is not guarenteed.

            To install:
            - Grab the .ZIP archive for your platform
            - Xbox: Put `default.xbe` under `<drive>\Games\nzportable\`, with game data in its `nzp\` directory.
            - Xbox 360: Boot `xenon.elf` through XeLL and put game data in `uda:/nzportable/nzp/`.
            - PSP: Extract the `EBOOT.PBP` to `/PSP/GAME/nzportable/`
            - PS2: Put `nzportable.elf` on USB and game data under `/APPS/NZPORTABLE/nzp/`.
            - PS VITA: Install `nzportable.vpk` using VitaShell.
            - PS4: Install `nzportable.pkg` and place game data under `/data/nzportable/nzp/`.
            - 3DS: Extract `nzportable.3dsx` to `/3ds/nzportable/`.
            - NSPIRE: Sync `nzportable.tns` to `/`.
            - PC: Extract the archive for your CPU architecture and run `nzportable`.
          draft: true
          prerelease: false

  Upload-Release:
    name: Upload ${{ matrix.name }} Release
    needs: Create-Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            artifact: linux-x86_64-nzp-sdl
          - name: Linux (x86)
            artifact: linux-x86-nzp-sdl
          - name: Linux (arm64)
            artifact: linux-arm64-nzp-sdl
          - name: Linux (armhf)
            artifact: linux-armhf-nzp-sdl
          - name: Windows (x86)
            artifact: windows-x86-nzp-sdl
          - name: Windows (x86_64)
            artifact: windows-x86_64-nzp-sdl
          - name: Xbox
            artifact: xbox-nzp-xbe
          - name: Xbox 360
            artifact: xbox360-nzp-elf
          - name: PlayStation 2
            artifact: ps2-nzp-elf
          - name: PlayStation Portable
            artifact: psp-nzp-eboot
          - name: Nintendo 3DS
            artifact: ctr-nzp-3dsx
          - name: TI-Nspire
            artifact: nspire-nzp-tns
          - name: PlayStation VITA
            artifact: psp2-nzp-vpk
          - name: PlayStation 4
            artifact: ps4-nzp-pkg
          - name: Nintendo Switch
            artifact: nx-nzp-nro
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
      - name: Create ZIP Archive
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: zip -r -j "$ARTIFACT.zip" "$ARTIFACT/"*
      - name: Upload Release Archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.Create-Release.outputs.upload_url }}
          asset_path: ./${{ matrix.artifact }}.zip
          asset_name: ${{ matrix.artifact }}.zip
          asset_content_type: application/zip

  Publish-Release:
    needs: [Create-Release, Upload-Release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: StuYarrow/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ needs.Create-Release.outputs.id }}
